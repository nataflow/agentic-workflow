[pytest]
# Test di luar `src/plugins/` supaya tidak ikut tersalin ke cache plugin pengguna.
testpaths = tests
# `from conftest import …` dari subdirektori mana pun di bawah tests/.
pythonpath = tests
# Nama berkas test yang sama muncul di beberapa plugin (mis. test_migrate_profile.py).
addopts = --import-mode=importlib -ra
xfail_strict = true
markers =
    regression(id): test regresi untuk ID temuan di ISSUES.md
